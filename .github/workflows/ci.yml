name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,research]' -r prototype/requirements-client.txt build twine pip-audit

      - name: Compile Python sources
        run: python -m compileall -q src assessment tests

      - name: Run core tests
        run: python -m pytest tests -q

      - name: Run assessment tests
        run: python -m pytest assessment/tests -q

      - name: Build distributions
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt -r prototype/requirements-client.txt

      - name: Verify typed package marker
        run: python -c "import importlib.resources as r; assert r.files('triage4').joinpath('py.typed').is_file()"
